name: custom-package-registry

services:
  dev:
    image: mcr.microsoft.com/dotnet/sdk:10.0.302-resolute-amd64@sha256:303563b156b9cccfb5f5316d18088d40e9073ab7fb47de76349c077eefdedbcf
    command: /bin/sh -c "sleep infinity"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - ../:/src
      - ../tests/custom-package-registry-test/logs:/logs

  package-registry:
    image: docker.io/loicsharma/baget:0.4.0-preview2@sha256:7ed7bdc3d29bb5145d69d1ca73b7c5fd4a34f72dd8b2810c907a6703b172b8ba
    environment:
      - ApiKey=fake-token
    ports:
      - "5001:80"
